version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  PRODUCTION VPS — extends docker-compose.yml
#  Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Key differences from local:
#   - DEBUG=False enforced
#   - Gunicorn workers scaled up
#   - DB uses EXTERNAL named volume (survives container removal)
#   - Nginx listens on 80 AND 443 (SSL via Certbot)
#   - Certbot container for Let's Encrypt
# ─────────────────────────────────────────────────────────────────

services:

  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: bind-mount for manual backup access
      # - /opt/evansimfs/db-backups:/backups
    restart: always

  backend:
    environment:
      DEBUG: "False"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      ALLOWED_HOSTS: "egcoperations.com,www.egcoperations.com,backend,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "https://egcoperations.com,https://www.egcoperations.com"
      # Shopify (values from .env)
      SHOPIFY_SHOP_URL: ${SHOPIFY_SHOP_URL}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}
      # QuickBooks (values from .env)
      QB_CLIENT_ID: ${QB_CLIENT_ID}
      QB_CLIENT_SECRET: ${QB_CLIENT_SECRET}
      QB_REALM_ID: ${QB_REALM_ID}
      QB_REFRESH_TOKEN: ${QB_REFRESH_TOKEN}
      QB_ENVIRONMENT: ${QB_ENVIRONMENT}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    ports: []          # Remove direct port exposure — nginx-proxy handles it
    restart: always

  # ── Reverse Proxy (SSL termination) ─────────────────
  nginx-proxy:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - greenway_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot (Let's Encrypt) ──────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run once to get cert, then runs renewal
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - greenway_net

volumes:
  postgres_data:
    external: true          # Pre-created on VPS: docker volume create greenway_postgres_data
    name: greenway_postgres_data
  certbot_www:
  certbot_certs:
